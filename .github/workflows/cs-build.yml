name: cs-build
on:
  push:
    branches: [cs/x2t-10.0]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: cs-x2t-10.0.0-ed63e94

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build x2t (output target)
        run: |
          start=$(date +%s)
          SKIP_TESTS=1 ./build.sh
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          ls -l build

      - name: Upload x2t.zip
        uses: actions/upload-artifact@v4
        with:
          name: x2t-build
          path: build/
          if-no-files-found: error

      - name: Run converter tests (30 min limit)
        continue-on-error: true
        run: |
          rm -rf results
          timeout 1800 docker build --target test-output -o results . || echo "TESTS_EXIT=$?" >> "$GITHUB_ENV"
          ls -l results || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x2t-test-results
          path: results/
          if-no-files-found: warn

      - name: Checksum
        run: |
          cd build
          sha256sum x2t.zip | tee x2t.zip.sha256
          ls -l x2t.wasm x2t.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: x2t 10.0.0 (core ed63e94)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            build/x2t.zip
            build/x2t.zip.sha256
          body: |
            ONLYOFFICE DocumentServer v10.0.0 core commit ed63e94de814ff1d4ea28cddfaba6939bc9df9ed, built to WebAssembly with the CryptPad recipe. build_tools v10.0.0.176, emsdk 4.0.11.
